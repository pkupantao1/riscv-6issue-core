<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <defs>
    <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="gx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDD6FE"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <style>
      .pt { font-size: 14.5px; font-weight: 800; fill: #1E3A5F; text-anchor: middle; }
      .ps { font-size: 11.5px; fill: #64748B; text-anchor: middle; }
      .v  { font-size: 12.5px; font-weight: 700; fill: #1E3A5F; text-anchor: middle; }
      .x  { font-size: 12.5px; fill: #3E5068; text-anchor: middle; }
      .bl { stroke: #94A3B8; stroke-width: 1.2; }
      .pn { fill: #F8FAFC; stroke: #E2E8F0; }
    </style>
  </defs>
  <rect width="900" height="360" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="20" font-weight="800" fill="#1E3A5F">分支预测器对比（trace 模型）</text>
  <text x="330" y="34" font-size="12.5" fill="#64748B">同一批 Spike trace；香山参考为按公开参数近似的模型</text>

  <rect class="pn" x="40"  y="50" width="260" height="290" rx="12"/>
  <rect class="pn" x="330" y="50" width="260" height="290" rx="12"/>
  <rect class="pn" x="620" y="50" width="260" height="290" rx="12"/>

  <text class="pt" x="170" y="74">CoreMark 条件 MPKI</text><text class="ps" x="170" y="91">越低越好</text>
  <text class="pt" x="460" y="74">Linux 总 MPKI</text><text class="ps" x="460" y="91">越低越好 · 17.5 亿条指令</text>
  <text class="pt" x="750" y="74">Linux 前端 IPC</text><text class="ps" x="750" y="91">越高越好</text>

  <line class="bl" x1="55"  y1="300" x2="285" y2="300"/>
  <line class="bl" x1="345" y1="300" x2="575" y2="300"/>
  <line class="bl" x1="635" y1="300" x2="865" y2="300"/>

  <!-- 面板 1：120 px / MPKI -->
  <rect x="95"  y="159.6" width="60" height="140.4" rx="5" fill="url(#gx)"/>
  <rect x="185" y="175.2" width="60" height="124.8" rx="5" fill="url(#gv)"/>
  <text class="v" x="125" y="151">1.17</text>
  <text class="v" x="215" y="167" fill="#1D4ED8">1.04</text>

  <!-- 面板 2：120 px / MPKI -->
  <rect x="385" y="151.2" width="60" height="148.8" rx="5" fill="url(#gx)"/>
  <rect x="475" y="172.8" width="60" height="127.2" rx="5" fill="url(#gv)"/>
  <text class="v" x="415" y="143">1.24</text>
  <text class="v" x="505" y="165" fill="#1D4ED8">1.06</text>

  <!-- 面板 3：40 px / IPC -->
  <rect x="675" y="126.4" width="60" height="173.6" rx="5" fill="url(#gx)"/>
  <rect x="765" y="119.2" width="60" height="180.8" rx="5" fill="url(#gv)"/>
  <text class="v" x="705" y="119">4.34</text>
  <text class="v" x="795" y="112" fill="#1D4ED8">4.52</text>

  <g class="x">
    <text x="125" y="320">香山参考</text><text x="215" y="320">本核 v2</text>
    <text x="415" y="320">香山参考</text><text x="505" y="320">本核 v2</text>
    <text x="705" y="320">香山参考</text><text x="795" y="320">本核 v2</text>
  </g>
</svg>
