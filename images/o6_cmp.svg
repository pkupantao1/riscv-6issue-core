<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900" height="458" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <defs>
    <linearGradient id="gx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="gk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDE9FE"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <style>
      .n  { font-size: 14px; font-weight: 700; fill: #1E3A5F; text-anchor: end; }
      .ns { font-size: 11.5px; fill: #64748B; text-anchor: end; }
      .v  { font-size: 13px; font-weight: 700; fill: #1E3A5F; }
      .ax { font-size: 12px; fill: #64748B; text-anchor: middle; }
      .g  { stroke: #E2E8F0; stroke-width: 1; }
    </style>
  </defs>
  <rect width="900" height="458" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="20" font-weight="800" fill="#1E3A5F">CoreMark/MHz 对比</text>
  <text x="256" y="34" font-size="12.5" fill="#64748B">外部数字取自公开资料，编译器、选项与迭代次数不同，只作量级参考</text>

  <!-- x(v) = 260 + 56 v -->
  <line class="g" x1="260" y1="58" x2="260" y2="402" stroke="#94A3B8"/>
  <line class="g" x1="372" y1="58" x2="372" y2="402"/>
  <line class="g" x1="484" y1="58" x2="484" y2="402"/>
  <line class="g" x1="596" y1="58" x2="596" y2="402"/>
  <line class="g" x1="708" y1="58" x2="708" y2="402"/>
  <line class="g" x1="820" y1="58" x2="820" y2="402"/>
  <text class="ax" x="260" y="420">0</text><text class="ax" x="372" y="420">2</text><text class="ax" x="484" y="420">4</text>
  <text class="ax" x="596" y="420">6</text><text class="ax" x="708" y="420">8</text><text class="ax" x="820" y="420">10</text>

  <rect x="260" y="68"  width="281.1" height="32" rx="5" fill="url(#gx)"/>
  <rect x="260" y="116" width="347.2" height="32" rx="5" fill="url(#gx)"/>
  <rect x="260" y="164" width="397.6" height="32" rx="5" fill="url(#gx)"/>
  <rect x="260" y="212" width="453.6" height="32" rx="5" fill="url(#gx)"/>
  <rect x="260" y="260" width="464.2" height="32" rx="5" fill="url(#gk)"/>
  <rect x="260" y="308" width="532.6" height="32" rx="5" fill="url(#go)"/>
  <rect x="260" y="356" width="555.5" height="32" rx="5" fill="url(#gb)"/>

  <text class="n"  x="244" y="83">NaxRiscv</text>
  <text class="ns" x="244" y="97">项目文档，FPGA 实测</text>
  <text class="n"  x="244" y="131">SonicBOOM</text>
  <text class="ns" x="244" y="145">CARRV 2020 论文</text>
  <text class="n"  x="244" y="179">XuanTie C910</text>
  <text class="ns" x="244" y="193">厂商公布 / ISCA 2020</text>
  <text class="n"  x="244" y="227">Arm Neoverse N1</text>
  <text class="ns" x="244" y="241">Ampere Altra 160 核，多核折算</text>
  <text class="n"  x="244" y="275">香山 昆明湖</text>
  <text class="ns" x="244" y="289">第三方 RTL 仿真，1 次迭代</text>
  <text class="n"  x="244" y="323" fill="#C2410C">本核 r11（当前）</text>
  <text class="ns" x="244" y="337">VCS 仿真，10 次迭代</text>
  <text class="n"  x="244" y="371" fill="#1D4ED8">本核 h2（峰值）</text>
  <text class="ns" x="244" y="385">VCS 仿真，10 次迭代</text>

  <text class="v" x="551" y="89">5.02</text>
  <text class="v" x="617" y="137">6.2</text>
  <text class="v" x="668" y="185">7.1</text>
  <text class="v" x="724" y="233">≈8.1</text>
  <text class="v" x="734" y="281" fill="#6D28D9">≈8.29</text>
  <text class="v" x="803" y="329" fill="#C2410C">≈9.51</text>
  <text class="v" x="826" y="377" fill="#1D4ED8">9.92</text>

  <text x="40" y="446" font-size="11.5" fill="#64748B">本核 CoreMark 用 rv64gc_zba_zbb_zbs 编译；仿真只跑 10 次迭代，达不到官方 10 秒要求，分数为 CoreMark/MHz 估算。</text>
</svg>
