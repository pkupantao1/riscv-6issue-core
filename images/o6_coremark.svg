<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <style>
      .ax { font-size: 12px; fill: #64748B; }
      .v  { font-size: 12.5px; font-weight: 700; fill: #1E3A5F; text-anchor: middle; }
      .x  { font-size: 13px; font-weight: 700; fill: #1E3A5F; text-anchor: middle; }
      .xs { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .g  { stroke: #E2E8F0; stroke-width: 1; }
    </style>
  </defs>
  <rect width="900" height="430" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="20" font-weight="800" fill="#1E3A5F">CoreMark/MHz 演进</text>
  <text x="250" y="34" font-size="12.5" fill="#64748B">VCS 仿真，10 次迭代，coremark_b（rv64gc_zba_zbb_zbs）</text>

  <!-- 网格 y(v) = 340 - 28 v -->
  <line class="g" x1="80" y1="340" x2="860" y2="340" stroke="#94A3B8"/>
  <line class="g" x1="80" y1="284" x2="860" y2="284"/>
  <line class="g" x1="80" y1="228" x2="860" y2="228"/>
  <line class="g" x1="80" y1="172" x2="860" y2="172"/>
  <line class="g" x1="80" y1="116" x2="860" y2="116"/>
  <line class="g" x1="80" y1="60"  x2="860" y2="60"/>
  <g class="ax" text-anchor="end">
    <text x="70" y="344">0</text><text x="70" y="288">2</text><text x="70" y="232">4</text>
    <text x="70" y="176">6</text><text x="70" y="120">8</text><text x="70" y="64">10</text>
  </g>

  <!-- 柱：8 个版本，柱心 128.75 + 97.5 i，宽 54 -->
  <rect x="101.75" y="182.6" width="54" height="157.4" rx="5" fill="url(#gb)"/>
  <rect x="199.25" y="167.7" width="54" height="172.3" rx="5" fill="url(#gb)"/>
  <rect x="296.75" y="149.0" width="54" height="191.0" rx="5" fill="url(#gb)"/>
  <rect x="394.25" y="116.5" width="54" height="223.5" rx="5" fill="url(#gb)"/>
  <rect x="491.75" y="91.0"  width="54" height="249.0" rx="5" fill="url(#gb)"/>
  <rect x="589.25" y="62.2"  width="54" height="277.8" rx="5" fill="url(#gp)"/>
  <rect x="686.75" y="65.8"  width="54" height="274.2" rx="5" fill="url(#gb)"/>
  <rect x="784.25" y="73.7"  width="54" height="266.3" rx="5" fill="url(#go)"/>

  <!-- 数值 -->
  <text class="v" x="128.75" y="175">5.62</text>
  <text class="v" x="226.25" y="160">6.16</text>
  <text class="v" x="323.75" y="141">6.82</text>
  <text class="v" x="421.25" y="109">7.98</text>
  <text class="v" x="518.75" y="83">8.89</text>
  <text class="v" x="616.25" y="54" fill="#1D4ED8">9.92</text>
  <text class="v" x="713.75" y="58">9.79</text>
  <text class="v" x="811.25" y="66" fill="#C2410C">≈9.51</text>

  <!-- 横轴 -->
  <text class="x" x="128.75" y="362">t44</text><text class="xs" x="128.75" y="380">TAGE v2</text>
  <text class="x" x="226.25" y="362">t49</text><text class="xs" x="226.25" y="380">ROB 192</text>
  <text class="x" x="323.75" y="362">s4</text><text class="xs" x="323.75" y="380">12 端口</text><text class="xs" x="323.75" y="395">投机唤醒</text>
  <text class="x" x="421.25" y="362">u3</text><text class="xs" x="421.25" y="380">B · IQ 扩容</text><text class="xs" x="421.25" y="395">SC · 6 ALU</text>
  <text class="x" x="518.75" y="362">g4</text><text class="xs" x="518.75" y="380">move 消除</text><text class="xs" x="518.75" y="395">uPHT</text>
  <text class="x" x="616.25" y="362">h2</text><text class="xs" x="616.25" y="380">load→load</text><text class="xs" x="616.25" y="395">快速路径</text>
  <text class="x" x="713.75" y="362">u4</text><text class="xs" x="713.75" y="380">6 GHz</text><text class="xs" x="713.75" y="395">流水调整</text>
  <text class="x" x="811.25" y="362">r11</text><text class="xs" x="811.25" y="380">RVA23 · H</text><text class="xs" x="811.25" y="395">Sv57 · 时序</text>

  <!-- 图例 -->
  <rect x="600" y="410" width="12" height="12" rx="2" fill="#1D4ED8"/><text x="618" y="420" class="ax">最高（h2）</text>
  <rect x="700" y="410" width="12" height="12" rx="2" fill="#F97316"/><text x="718" y="420" class="ax">当前（r11）</text>
</svg>
