# OpenOCD 配置：经外部 JTAG 适配器调试 VU7P 上的 OOO6 (rv_tck/rv_tms/rv_tdi/rv_tdo 引脚)
# 用法：openocd -f openocd_o6.cfg ；然后 riscv64-unknown-elf-gdb -ex "target extended-remote :3333"
# 适配器部分按实际硬件改 (这里以 FT2232H 通道 A 为例)

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 5000
transport select jtag

# DTM：IR 5 位，IDCODE = 0x00000dcb (o6_dtm_jtag 默认值)
jtag newtap o6 cpu -irlen 5 -expected-id 0x00000dcb

target create o6.cpu riscv -chain-position o6.cpu
# 只支持抽象命令 + progbuf (无系统总线访问)：访存走 progbuf
riscv set_mem_access progbuf
riscv set_command_timeout_sec 5

init
halt
